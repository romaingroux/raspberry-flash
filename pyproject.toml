[project]
name = "nas-flash"
dynamic = ["version"]
description = "Flash Raspberry Pi OS images onto an SD card for the Raspberry Pi NAS"
authors = [
    {name = "Romain Groux",email = "romaingroux@users.noreply.github.com"}
]
license = {text = "GNU"}
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "click>=8.1",
]


[project.scripts]
nas-flash = "nas_flash.cli:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "black>=25.9.0",
    "docformatter>=1.7.7",
    "mypy>=1.18.2",
    "pyinstaller>=6.11.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.9",
    "vulture>=2.14",
]


[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"


[tool.hatch.build.targets.wheel]
packages = ["src/nas_flash"]


[tool.black]
line-length = 88


[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true


[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

# Enable high-signal rules only
lint.select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "ARG",  # unused arguments
    "PL",   # pylint (selected rules)
]

# Avoid fighting Black
lint.ignore = [
    "E501",  # line length (Black handles it)
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR2004"]


[tool.vulture]
min_confidence = 80


[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88
